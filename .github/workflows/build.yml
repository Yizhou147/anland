name: Build APK and Daemon

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` yields the real commit
          # count for versionCode (shallow checkout would make it always 1).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 ndk;29.0.13113456"
          accept-android-sdk-licenses: true

      - name: Set NDK_DIR environment variable
        run: echo "NDK_DIR=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV

      # Restore the SAME keystore used for local builds so that CI-built APKs
      # share the signature with locally-built ones and can be installed over
      # them without uninstalling first. The keystore is stored base64-encoded
      # in the ANLAND_KEYSTORE_BASE64 repository secret (alias androiddebugkey,
      # store/key password "android", matching AGP's default debug keystore).
      - name: Restore debug keystore from secret
        run: |
          mkdir -p $HOME/.android
          echo "${{ secrets.ANLAND_KEYSTORE_BASE64 }}" | base64 -d > $HOME/.android/debug.keystore
          ls -l $HOME/.android/debug.keystore

      - name: Verify keystore
        run: |
          test -s $HOME/.android/debug.keystore || { echo "::error::ANLAND_KEYSTORE_BASE64 secret is empty or not set"; exit 1; }
          keytool -list -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1 \
            || { echo "::error::Invalid keystore restored from ANLAND_KEYSTORE_BASE64"; exit 1; }
          echo "Keystore OK: $(keytool -list -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -i sha1)"

      - name: Build APK
        working-directory: consumers/anland_v5/android_consumer
        run: |
          chmod +x gradlew
          # Pass debug signing as project properties on the command line instead of
          # appending to the tracked gradle.properties, which would dirty the working
          # tree and make the git-derived versionName ("...-dirty") wrong on CI.
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/anland-v5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: anland-v5
          path: consumers/anland_v5/android_consumer/app/build/outputs/apk/release/anland-v5.apk

      - name: Configure CMake for Android
        run: |
          cmake -S . -B build_daemon_android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build display_daemon
        run: cmake --build build_daemon_android --target display_daemon -j$(nproc)

      - name: Copy daemon to magisk_module directory
        run: |
          cp build_daemon_android/display_daemon magisk_module/
          chmod 755 magisk_module/display_daemon

      - name: Upload Magisk module
        uses: actions/upload-artifact@v7
        with:
          name: anland-daemon
          path: magisk_module/